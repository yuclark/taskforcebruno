name: Keep Render API Warm (Backup Ping)

on:
  schedule:
    # Primary 24/7 keep-alive runs every 6 minutes inside Supabase pg_cron
    # (`tfb-render-keepalive` using pg_net). This workflow is a lightweight
    # off-minute 24/7 backup to avoid GitHub Actions' top-of-hour congestion.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    name: Ping Render /api/health/
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake / Ping Task Force Bruno API
        run: |
          echo "Pinging Task Force Bruno Render API at $(date -u)"
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 60 \
            "https://taskforcebruno.onrender.com/api/health/"
          echo ""
          echo "API responded healthy."
