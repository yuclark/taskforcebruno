name: Keep Render API Warm (Backup Ping)

on:
  schedule:
    # Primary keep-alive runs every 6 minutes inside Supabase pg_cron
    # (`tfb-render-keepalive` using pg_net) from 6:00 AM to 2:00 AM PHT (UTC+8)
    # = 22:00-23:59 and 00:00-17:59 UTC (sleeps 2:00 AM - 6:00 AM PHT to save
    # ~125 free Render hours/month for other services).
    # This workflow is an off-minute backup matching the exact same window.
    - cron: "7,27,47 0-17,22-23 * * *"
  workflow_dispatch:

jobs:
  ping-health:
    name: Ping Render /api/health/
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake / Ping Task Force Bruno API
        run: |
          echo "Pinging Task Force Bruno Render API at $(date -u)"
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 60 \
            "https://taskforcebruno.onrender.com/api/health/"
          echo ""
          echo "API responded healthy."
